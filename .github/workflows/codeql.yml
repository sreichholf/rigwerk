name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

# A new push to a pull request cancels its older runs; a stacked series
# otherwise fills the runner queue with superseded commits.  Pushes to
# master and scheduled runs group by commit, so none is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every action is pinned by commit SHA (the tag or ref is in the trailing
# comment), like the toolchain.  Updating one is a deliberate edit of the SHA.
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Same pin as ci.yml.
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The Rust extractor runs build scripts; pipewire-sys and alsa-sys
      # need their headers.  Only the Linux cfg is analyzed.
      - name: Install system libraries
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master @ 2026-11-15
        if: matrix.language == 'rust'
        with:
          toolchain: 1.95.0

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: /language:${{ matrix.language }}

  # Scan the Windows-only code (`audio/win`, `app/plugin_gui/win32.rs`) with a
  # distinct category, so the Linux Rust database is kept.  The image is
  # pinned, the checkout, toolchain and CodeQL pins match the Linux job, and
  # the first run passed.
  analyze-windows:
    name: Analyze (rust, Windows)
    # The analysis image is pinned on purpose, so an alert set does not move
    # when GitHub rotates a runner.  The ci.yml Windows build tracks
    # windows-latest instead.
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Same pin as ci.yml.  rustup and cargo must be on PATH for the
      # extractor, and Cargo.toml needs 1.95 (the MSRV).
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master @ 2026-11-15
        with:
          toolchain: 1.95.0

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: rust
          build-mode: none

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: /language:rust-windows
