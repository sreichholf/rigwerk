name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

# A new push to a pull request cancels its older runs; a stacked series
# otherwise fills the runner queue with superseded commits.  Pushes to
# master and scheduled runs group by commit, so none is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every action is pinned by commit SHA (the tag or ref is in the trailing
# comment), like the toolchain.  Updating one is a deliberate edit of the SHA.
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Same pin as ci.yml.
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The Rust extractor runs build scripts; pipewire-sys and alsa-sys
      # need their headers.  Only the Linux cfg is analyzed.
      - name: Install system libraries
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master @ 2026-11-15
        if: matrix.language == 'rust'
        with:
          toolchain: 1.95.0

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: /language:${{ matrix.language }}
