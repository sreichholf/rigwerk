name: CI

on:
  push:
    branches: [master]
  pull_request:
    # No test reads docs/ and nothing compiles markdown, so prose and images
    # do not run the build.  There is no protected branch to wait on a check
    # that never starts.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.cursor/**'

# A new push to a pull request cancels its older runs; a stacked series
# otherwise fills the runner queue with superseded commits.  Pushes to
# master group by commit, so none is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Every action is pinned by commit SHA (the tag or ref is in the trailing
# comment), like the toolchain.  Updating one is a deliberate edit of the SHA.
jobs:
  linux:
    name: Linux
    # Pin until the Ubuntu 26 migration is boring; ubuntu-latest starts
    # moving there on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The mirror is slow, so the archives are cached; see the action.
      - name: Install system libraries
        uses: ./.github/actions/linux-deps

      # rust-toolchain.toml pins 1.95.0 (MSRV) with rustfmt + clippy.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master @ 2026-11-15
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # The release side of the RT guard is checked here: a release build
      # counts nothing, and only that profile runs the tests that pin it.  The
      # filter keeps this to a few tests; the rest of the suite stays debug.
      - name: Release RT guard tests
        timeout-minutes: 20
        run: cargo test --locked --release rt_guard

      - name: Compile ignored hardware tests
        run: cargo test --locked --no-run -- --ignored

      - name: Release build
        run: cargo build --locked --release

      # The Steinberg SDK samples the vst3_fixture tests load, built by the
      # script and cached per runner OS and script revision (which pins the
      # SDK tag).
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .vst3-fixtures/plugins
          key: vst3-fixtures-${{ runner.os }}-${{ hashFiles('scripts/vst3-fixtures.sh') }}

      - name: Build VST3 fixtures
        timeout-minutes: 20
        run: bash scripts/vst3-fixtures.sh .vst3-fixtures

      - name: VST3 fixture tests
        timeout-minutes: 10
        env:
          RIGWERK_VST3_FIXTURES: ${{ github.workspace }}/.vst3-fixtures/plugins
        run: xvfb-run -a cargo test --locked vst3_fixture -- --nocapture --skip vst3_fixture_opens_and_closes

      - name: VST3 editor test
        timeout-minutes: 10
        env:
          RIGWERK_VST3_FIXTURES: ${{ github.workspace }}/.vst3-fixtures/plugins
        run: xvfb-run -a cargo test --locked vst3_fixture_opens_and_closes -- --nocapture

      # The LV2 repository's example bundles the lv2_fixture tests load,
      # built by the script and cached per runner OS and script revision
      # (which pins the LV2 tag).  Linux only: the script is POSIX and the
      # fixtures are not built on Windows yet.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lv2-fixtures/plugins
          key: lv2-fixtures-${{ runner.os }}-${{ hashFiles('scripts/lv2-fixtures.sh') }}

      - name: Build LV2 fixtures
        timeout-minutes: 10
        run: bash scripts/lv2-fixtures.sh .lv2-fixtures

      - name: LV2 fixture tests
        timeout-minutes: 10
        env:
          RIGWERK_LV2_FIXTURES: ${{ github.workspace }}/.lv2-fixtures/plugins
        run: cargo test --locked lv2_fixture -- --nocapture

      # The upstream nam-rs checks (rustfmt, clippy, parity against the NAM
      # Core fixtures, real-time safety) run against vendor/nam-rs, in the
      # dev and the release profile RigWerk builds it with.  Its fixtures are not committed.
      - name: nam-rs parity tests
        timeout-minutes: 10
        run: bash scripts/nam-rs-parity.sh .nam-rs-parity

      - name: Upload nam-rs parity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nam-rs-vendor-diff
          path: .nam-rs-parity/nam-rs-vendor.diff

  # Advisories, licences, bans, and sources for the locked crates (deny.toml).
  # No build: the action's image ships cargo-deny, which reads Cargo.lock
  # through `cargo metadata`.
  deny:
    name: Deny
    runs-on: ubuntu-24.04
    # A step timeout does not cap the job, so both are set.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        timeout-minutes: 10
        with:
          command: check
          arguments: --all-features --locked

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master @ 2026-11-15
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Compile ignored hardware tests
        run: cargo test --locked --no-run -- --ignored

      - name: Release build
        run: cargo build --locked --release

      # The Steinberg SDK samples the vst3_fixture tests load, built by the
      # script and cached per runner OS and script revision (which pins the
      # SDK tag).
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .vst3-fixtures/plugins
          key: vst3-fixtures-${{ runner.os }}-${{ hashFiles('scripts/vst3-fixtures.sh') }}

      - name: Build VST3 fixtures
        timeout-minutes: 20
        shell: bash
        run: bash scripts/vst3-fixtures.sh .vst3-fixtures

      - name: VST3 fixture tests
        timeout-minutes: 10
        env:
          RIGWERK_VST3_FIXTURES: ${{ github.workspace }}/.vst3-fixtures/plugins
        run: cargo test --locked vst3_fixture -- --nocapture --skip vst3_fixture_opens_and_closes

      - name: VST3 editor test
        timeout-minutes: 10
        env:
          RIGWERK_VST3_FIXTURES: ${{ github.workspace }}/.vst3-fixtures/plugins
        run: cargo test --locked vst3_fixture_opens_and_closes -- --nocapture

