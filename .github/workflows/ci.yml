name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    # Pin until the Ubuntu 26 migration is boring; ubuntu-latest starts
    # moving there on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The mirror is slow (minutes for ~60 MB), so the downloaded .debs
      # are cached.  Install still runs apt, so a stale cache only means a
      # few fresh downloads; autoclean drops versions the mirror no longer
      # has, which keeps the cache from growing.
      - name: Restore apt archives
        id: apt-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-24.04-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-24.04-

      - name: Install system libraries
        run: |
          archives="$HOME/apt-archives"
          mkdir -p "$archives/partial"
          apt_opts=(-o "Dir::Cache::Archives=$archives" -o APT::Keep-Downloaded-Packages=true)
          # man-db rebuilds its index after every install; nothing reads it.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${apt_opts[@]}" \
            libasound2-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            pkg-config \
            ninja-build \
            meson \
            libsndfile1-dev \
            libsamplerate0-dev \
            xvfb \
            libx11-xcb-dev \
            libxcb-util-dev \
            libxcb-cursor-dev \
            libxcb-xkb-dev \
            libxcb-keysyms1-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libgtkmm-3.0-dev
          sudo apt-get autoclean "${apt_opts[@]}"
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$USER" "$archives"

      - name: Save apt archives
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      # rust-toolchain.toml pins 1.95.0 (MSRV) with rustfmt + clippy.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Compile ignored hardware tests
        run: cargo test --locked --no-run -- --ignored

      - name: Release build
        run: cargo build --locked --release

      # The Steinberg SDK samples the vst3_fixture tests load, built by the
      # script and cached per runner OS and script revision (which pins the
      # SDK tag).
      - uses: actions/cache@v5
        with:
          path: .vst3-fixtures/plugins
          key: vst3-fixtures-${{ runner.os }}-${{ hashFiles('scripts/vst3-fixtures.sh') }}

      - name: Build VST3 fixtures
        timeout-minutes: 20
        run: bash scripts/vst3-fixtures.sh .vst3-fixtures

      - name: VST3 fixture tests
        timeout-minutes: 10
        env:
          RIGWERK_VST3_FIXTURES: ${{ github.workspace }}/.vst3-fixtures/plugins
        run: xvfb-run -a cargo test --locked vst3_fixture -- --nocapture --skip vst3_fixture_opens_and_closes

      - name: VST3 editor test
        timeout-minutes: 10
        env:
          RIGWERK_VST3_FIXTURES: ${{ github.workspace }}/.vst3-fixtures/plugins
        run: xvfb-run -a cargo test --locked vst3_fixture_opens_and_closes -- --nocapture

      # The LV2 repository's example bundles the lv2_fixture tests load,
      # built by the script and cached per runner OS and script revision
      # (which pins the LV2 tag).  Linux only: the script is POSIX and the
      # fixtures are not built on Windows yet.
      - uses: actions/cache@v5
        with:
          path: .lv2-fixtures/plugins
          key: lv2-fixtures-${{ runner.os }}-${{ hashFiles('scripts/lv2-fixtures.sh') }}

      - name: Build LV2 fixtures
        timeout-minutes: 10
        run: bash scripts/lv2-fixtures.sh .lv2-fixtures

      - name: LV2 fixture tests
        timeout-minutes: 10
        env:
          RIGWERK_LV2_FIXTURES: ${{ github.workspace }}/.lv2-fixtures/plugins
        run: cargo test --locked lv2_fixture -- --nocapture

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Compile ignored hardware tests
        run: cargo test --locked --no-run -- --ignored

      - name: Release build
        run: cargo build --locked --release

      # The Steinberg SDK samples the vst3_fixture tests load, built by the
      # script and cached per runner OS and script revision (which pins the
      # SDK tag).
      - uses: actions/cache@v5
        with:
          path: .vst3-fixtures/plugins
          key: vst3-fixtures-${{ runner.os }}-${{ hashFiles('scripts/vst3-fixtures.sh') }}

      - name: Build VST3 fixtures
        timeout-minutes: 20
        shell: bash
        run: bash scripts/vst3-fixtures.sh .vst3-fixtures

      - name: VST3 fixture tests
        timeout-minutes: 10
        env:
          RIGWERK_VST3_FIXTURES: ${{ github.workspace }}/.vst3-fixtures/plugins
        run: cargo test --locked vst3_fixture -- --nocapture --skip vst3_fixture_opens_and_closes

      - name: VST3 editor test
        timeout-minutes: 10
        env:
          RIGWERK_VST3_FIXTURES: ${{ github.workspace }}/.vst3-fixtures/plugins
        run: cargo test --locked vst3_fixture_opens_and_closes -- --nocapture

