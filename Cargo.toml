[package]
name = "rigwerk"
version = "0.8.0"
edition = "2021"
rust-version = "1.95"
description = "Independent audio bridge: any input clock to any output clock (PipeWire, ALSA, ASIO, WASAPI)"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
# accesskit exposes the widget tree to screen readers (AT-SPI, UI Automation).
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
# The format eframe stores preferences in; used directly so a damaged saved
# entry can be skipped (and an unreadable file kept) instead of lost.
ron = "0.12"
cpal = "0.18"
# PNG for screenshots, ICO for the embedded window and About icon.
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
# Preset-guided per-string spectra for the tuner.
rustfft = "6"
# The raw VST3 bindings (COM pointers, interfaces, `Class`) that RigWerk's own
# VST3 host in `audio/vst3` is built on.  The crate ships its own bindings, so
# no Steinberg SDK or extra native toolchain is needed.
vst3 = "0.3"
# A VST3 bundle's `moduleinfo.json`, read by the library scan once its
# comments and trailing commas are stripped (`audio/vst3/scan.rs`).
serde_json = "1"
# CLAP discovery and hosting.  The bindings are plain C, and libloading opens
# the .clap bundles at runtime without a build-time SDK.
clap-sys = "0.5"
# The raw LV2 C types (descriptors, features, atom/worker/state interfaces)
# that RigWerk's own LV2 host in `audio/lv2` is built on.  Pre-generated
# bindings, so no LV2 SDK or extra native toolchain is needed.
lv2-sys = "2.0.0"
# Reads a bundle's Turtle (`.ttl`) files for the scan, with no system
# `lilv`.  Only the sync parser is used.
oxttl = { version = "0.2.5", default-features = false }
libloading = "0.8"
# The C heap that LV2 `state:mapPath` strings come from (a plugin may free
# them with `free()`).  On Linux also the netlink uevent socket for
# sound-card add/remove and poll() for the fds a CLAP plugin registers; no
# libudev.
libc = "0.2"
nam-rs = "0.4"
# WAV reader for cabinet impulse responses.  The UI thread is the only
# caller; the audio callback never opens a file.
hound = "3.5.1"
# Native folder window for the amp captures.
rfd = "0.18"
# Clipboard text, and a folder copied from Explorer (not plain text).
arboard = "3.7"
# Parent that folder window on this process's viewport.
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# `realtime` registers cpal's own WASAPI stream threads with MMCSS "Audio"
# (falling back to THREAD_PRIORITY_TIME_CRITICAL), so a busy UI cannot make a
# small buffer late.  A
# refusal is reported as `RealtimeDenied`, which the stream error callbacks do
# not treat as device loss.  On Linux this feature does nothing without
# rtkit/D-Bus, so RigWerk promotes its cpal threads itself (`thread_priority`).
cpal = { version = "0.18", features = ["realtime"] }
azo = "0.5"
# Direct WASAPI access for REAL-style (IAudioClient3 shared minimum step) and
# exclusive clock output.  Also the Win32 window a CLAP editor embeds in and
# the paste hotkey.  Same version cpal already uses.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    # CreateEventW's event-attributes parameter is in Win32::Security.
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux needs a window system; the default features that bring it are off
# above, so X11 and Wayland are switched back on here.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11", "wayland"] }
# The X11 window a plugin editor embeds in.
xcb = "1.7"
# Native PipeWire client. The ALSA `pipewire` plugin is not the Linux path.
# v0_3_50 exposes pw_buffer.requested so playback fills one quantum, not maxsize.
pipewire = { version = "0.10", features = ["v0_3_50"] }

[profile.release]
opt-level = 3
# One codegen unit, so the hot non-`#[inline]` calls between `audio/mixer`,
# `audio/path` and the plugin chain can inline: the default 16 units put them
# in separate modules, where they cannot.  It gives up parallel codegen, and
# what the inlining is worth here is not measured.  No LTO: the DSP kernels
# sit inside nam-rs and never cross the crate boundary, so LTO would only
# remove one call per block.
codegen-units = 1

# nam-rs with faster kernels; vendor/nam-rs/RIGWERK.md says what changed.
[patch.crates-io]
nam-rs = { path = "vendor/nam-rs" }

# nam-rs runs at opt-level 3 in every profile, whatever the rest of the
# build uses.  Unoptimised it is far slower than real time, and its conv
# tiles only vectorise at 3: at 2 a standard WaveNet costs about four
# times as much.
[profile.dev.package.nam-rs]
opt-level = 3

[profile.release.package.nam-rs]
opt-level = 3
