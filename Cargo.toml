[package]
name = "rigwerk"
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
description = "Independent audio bridge: any input clock to any output clock (PipeWire, ALSA, ASIO, WASAPI)"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
# The format eframe stores preferences in; used directly so a damaged saved
# entry can be skipped (and an unreadable file kept) instead of lost.
ron = "0.12"
cpal = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
# VST3 discovery, hosting and processing.  The crate ships its own bindings,
# so no Steinberg SDK or extra native toolchain is needed.
vst3-host = { version = "0.11", default-features = false }
# CLAP discovery and hosting.  The bindings are plain C, and libloading opens
# the .clap bundles at runtime without a build-time SDK.
clap-sys = "0.5"
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
azo = "0.5"
winapi = { version = "0.3", features = ["libloaderapi", "minwindef", "windef", "winuser"] }
# Direct WASAPI access for the REAL-style output (IAudioClient3 at the
# smallest engine step the driver allows).  Same version cpal already uses.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux needs a window system; the default features that bring it are off
# above, so X11 and Wayland are switched back on here.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11", "wayland"] }
# Netlink uevent socket for sound-card add/remove. No libudev.
libc = "0.2"
# Native PipeWire client. The ALSA `pipewire` plugin is not the Linux path.
# v0_3_50 exposes pw_buffer.requested so playback fills one quantum, not maxsize.
pipewire = { version = "0.10", features = ["v0_3_50"] }

[profile.release]
opt-level = 2

